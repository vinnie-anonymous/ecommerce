{% extends 'base.html' %}
{% block title %}{{ title }} – Dashboard{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <h3 class="fw-bold mb-4">{{ title }}</h3>
    <div class="card shadow-sm">
      <div class="card-body">
        <form method="POST" enctype="multipart/form-data">
          {% csrf_token %}
          {% for field in form %}
          <div class="mb-3">
            <label class="form-label">{{ field.label }}</label>
            {{ field }}
            {{ field.errors }}
          </div>
          {% endfor %}
          <button type="submit" class="btn btn-brand">Save Product</button>
          <a href="{% url 'dashboard:product_list' %}" class="btn btn-outline-secondary">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
